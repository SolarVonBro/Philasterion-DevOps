services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: philasterion_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: philasterion_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: philasterion_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_devops}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_secret --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - app-network

  node:
    image: node:20-alpine
    container_name: philasterion_node
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_data:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - app-network
    profiles:
      - dev

volumes:
  db_data:
  vendor_data:
  node_modules_data:

networks:
  app-network:
    driver: bridge
