name: CI

on:
  push:
    branches: [main, dev, lab4]
  pull_request:
    branches: [main, dev, lab4]

jobs:

  # ─── SERVER ────────────────────────────────────────────────────────────────

  server-test:
    name: Server — Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, zip, bcmath, gd, pcntl, exif
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy env & generate key
        run: |
          cp .env.example .env
          sed -i 's|DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=:memory:|' .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test --stop-on-failure

  server-build:
    name: Server — Build
    runs-on: ubuntu-latest
    needs: server-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, pdo_mysql, zip, bcmath, gd, pcntl, exif
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy env & generate key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validate config loads
        run: php artisan config:cache && php artisan config:clear

  # ─── CLIENT ────────────────────────────────────────────────────────────────

  client-test:
    name: Client — Test
    runs-on: ubuntu-latest
    needs: server-build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  client-build:
    name: Client — Build
    runs-on: ubuntu-latest
    needs: client-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 1

  docker-push:
    name: Push Docker images to GHCR
    runs-on: ubuntu-latest
    needs: [server-test, client-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/lab4'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/philasterion-backend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/philasterion-frontend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=http://backend-service

      - name: Update k8s manifests with new image tag
        if: github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sed -i "s|ghcr.io/${OWNER_LOWER}/philasterion-backend:.*|ghcr.io/${OWNER_LOWER}/philasterion-backend:${SHORT_SHA}|g" k8s/backend.yaml
          sed -i "s|ghcr.io/${OWNER_LOWER}/philasterion-frontend:.*|ghcr.io/${OWNER_LOWER}/philasterion-frontend:${SHORT_SHA}|g" k8s/frontend.yaml

      - name: Commit updated manifests
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/backend.yaml k8s/frontend.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push

  sonarqube:
    name: SonarQube Analysis
    runs-on: self-hosted
    needs: [server-test, client-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, pcov
          coverage: pcov

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy env & generate key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHP tests with coverage
        run: php artisan test --coverage-clover=coverage.xml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run JS tests with coverage
        run: npx vitest run --coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  notify-telegram:
    name: Telegram Notification
    runs-on: ubuntu-latest
    needs: [server-build, server-test, client-build, client-test, sonarqube, docker-push]
    if: always()

    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.server-build.result }}" == "success" && \
                "${{ needs.server-test.result }}" == "success" && \
                "${{ needs.client-build.result }}" == "success" && \
                "${{ needs.client-test.result }}" == "success" && \
                "${{ needs.sonarqube.result }}" == "success" && \
                "${{ needs.docker-push.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram notification
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          MESSAGE="${{ steps.status.outputs.emoji }} <b>Philasterion CI/CD</b>

          Branch: ${{ github.ref_name }}
          Commit: ${SHORT_SHA}
          Author: ${{ github.actor }}

          server-build: ${{ needs.server-build.result }}
          server-test: ${{ needs.server-test.result }}
          client-build: ${{ needs.client-build.result }}
          client-test: ${{ needs.client-test.result }}
          sonarqube: ${{ needs.sonarqube.result }}
          docker-push: ${{ needs.docker-push.result }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": \"${MESSAGE}\", \"parse_mode\": \"HTML\"}"
