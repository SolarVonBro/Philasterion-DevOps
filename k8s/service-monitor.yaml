apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
    - philasterion
  selector:
    matchLabels:
      app: backend
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics