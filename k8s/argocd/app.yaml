apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: philasterion
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SolarVonBro/Philasterion-DevOps.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: philasterion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
